spring:
  application:
    name: traceflow-demo
  datasource:
    url: jdbc:h2:mem:traceflow-demo;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

traceflow:
  enabled: true
  service:
    name: ${SERVICE_NAME:traceflow-demo}
  environment:
    name: ${ENVIRONMENT:local}
  tracing:
    enabled: true
  metrics:
    enabled: true
  logging:
    enabled: true
  otlp:
    endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    io.traceflow: INFO
