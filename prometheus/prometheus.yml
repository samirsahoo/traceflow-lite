# Prometheus scrapes TraceFlow-instrumented apps directly at their
# /actuator/prometheus endpoint (Section 14) - metrics never pass through
# the OTel Collector in this MVP; see traceflow-collector/config.yaml for why.

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: traceflow-demo
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["demo:8080"]
        labels:
          service: traceflow-demo
