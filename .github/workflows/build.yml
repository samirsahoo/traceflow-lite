name: Build

on:
  push:
    branches: [main]
    paths: ["traceflow-lite/**"]
  pull_request:
    paths: ["traceflow-lite/**"]

defaults:
  run:
    working-directory: traceflow-lite

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile
        run: mvn -B -ntp compile

      - name: Unit tests
        run: mvn -B -ntp test

      - name: Package + integration tests
        run: mvn -B -ntp verify

      - name: Upload surefire/failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            traceflow-lite/**/target/surefire-reports/**
            traceflow-lite/**/target/failsafe-reports/**
          if-no-files-found: ignore
