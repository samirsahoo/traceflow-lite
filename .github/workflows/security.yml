name: Security

on:
  push:
    branches: [main]
    paths: ["traceflow-lite/**"]
  pull_request:
    paths: ["traceflow-lite/**"]
  schedule:
    - cron: "0 6 * * 1" # weekly, catches newly disclosed CVEs in unchanged deps

defaults:
  run:
    working-directory: traceflow-lite

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: OWASP dependency-check
        run: mvn -B -ntp org.owasp:dependency-check-maven:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: traceflow-lite/**/target/dependency-check-report.html
          if-no-files-found: ignore

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Generate CycloneDX SBOM
        run: mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: traceflow-lite/target/bom.*
          if-no-files-found: ignore
