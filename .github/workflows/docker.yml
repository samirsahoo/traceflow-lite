name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package the demo app jar
        run: mvn -B -ntp -pl traceflow-demo -am package -DskipTests

      - name: Build image (not pushed - Section 25)
        run: |
          docker build -f deployment/docker/Dockerfile -t traceflow-demo:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: traceflow-demo:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
