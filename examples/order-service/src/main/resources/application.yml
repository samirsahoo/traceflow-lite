spring:
  application:
    name: order-service

server:
  port: ${SERVER_PORT:8081}

payment-service:
  base-url: ${PAYMENT_SERVICE_URL:http://localhost:8082}

traceflow:
  service:
    name: ${SERVICE_NAME:order-service}
  environment:
    name: ${ENVIRONMENT:local}
  otlp:
    endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
