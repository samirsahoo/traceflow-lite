# Ships every container's stdout to Loki (Section 12). Applications already
# log structured JSON (Section 9), so Promtail only needs to extract "level"
# as an indexed label - traceId/spanId stay in the log line and are queried
# at read time (`| json | traceId="..."`), never turned into a label: an
# indexed traceId label would be exactly the unbounded-cardinality mistake
# Section 7 warns against for metrics, and it applies just as much to logs.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
    pipeline_stages:
      - json:
          expressions:
            level: level
      - labels:
          level:
