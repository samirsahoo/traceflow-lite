apiVersion: apps/v1
kind: Deployment
metadata:
  name: traceflow-demo
  namespace: traceflow-lite
  labels:
    app.kubernetes.io/name: traceflow-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: traceflow-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traceflow-demo
    spec:
      serviceAccountName: traceflow-demo
      # No runAsUser/fsGroup pinned: the image already runs as a non-root user
      # (see deployment/docker/Dockerfile), and leaving these unset lets
      # OpenShift's restricted-v2 SCC assign its own UID instead of colliding
      # with one we hardcoded (Section 19).
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traceflow-demo
          image: traceflow-demo:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: traceflow-demo-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CONTAINER_NAME
              value: traceflow-demo
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
