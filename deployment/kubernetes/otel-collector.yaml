apiVersion: apps/v1
kind: Deployment
metadata:
  name: traceflow-collector
  namespace: traceflow-lite
  labels:
    app.kubernetes.io/name: traceflow-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traceflow-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traceflow-collector
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.116.1
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otel
      volumes:
        - name: config
          configMap:
            name: traceflow-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: traceflow-collector
  namespace: traceflow-lite
  labels:
    app.kubernetes.io/name: traceflow-collector
spec:
  selector:
    app.kubernetes.io/name: traceflow-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
