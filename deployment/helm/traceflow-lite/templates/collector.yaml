{{- if .Values.otelCollector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "traceflow-lite.fullname" . }}-collector-config
  labels:
    {{- include "traceflow-lite.labels" . | nindent 4 }}
    app.kubernetes.io/name: traceflow-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 2s
        limit_mib: 200
        spike_limit_mib: 50
      batch:
        send_batch_size: 512
        timeout: 5s
      resource:
        attributes:
          - key: collector.name
            value: traceflow-collector
            action: upsert
    exporters:
      otlp/tempo:
        endpoint: {{ .Values.tempoEndpoint | quote }}
        tls:
          insecure: true
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp/tempo]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "traceflow-lite.fullname" . }}-collector
  labels:
    {{- include "traceflow-lite.labels" . | nindent 4 }}
    app.kubernetes.io/name: traceflow-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traceflow-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traceflow-collector
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: "{{ .Values.otelCollector.image.repository }}:{{ .Values.otelCollector.image.tag }}"
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.otelCollector.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otel
      volumes:
        - name: config
          configMap:
            name: {{ include "traceflow-lite.fullname" . }}-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "traceflow-lite.fullname" . }}-collector
  labels:
    {{- include "traceflow-lite.labels" . | nindent 4 }}
    app.kubernetes.io/name: traceflow-collector
spec:
  selector:
    app.kubernetes.io/name: traceflow-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
{{- end }}
