apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "traceflow-lite.fullname" . }}-demo
  labels:
    {{- include "traceflow-lite.labels" . | nindent 4 }}
    app.kubernetes.io/name: traceflow-demo
spec:
  replicas: {{ .Values.demo.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: traceflow-demo
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traceflow-demo
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "traceflow-lite.fullname" . }}-demo
      # No runAsUser/fsGroup pinned - see deployment/kubernetes/deployment.yaml
      # for why (Section 19: OpenShift SCC compatibility).
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traceflow-demo
          image: "{{ .Values.demo.image.repository }}:{{ .Values.demo.image.tag }}"
          imagePullPolicy: {{ .Values.demo.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: {{ .Values.demo.env.serviceName | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.demo.env.environmentName | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ if .Values.otelCollector.enabled }}{{ printf "http://%s-collector:4317" (include "traceflow-lite.fullname" .) | quote }}{{ else }}{{ .Values.otelCollector.externalEndpoint | quote }}{{ end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CONTAINER_NAME
              value: traceflow-demo
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.demo.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
